[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibe2text"
version = "0.0.1"
description = "Транскрибация и расшифровка аудио и видео в текст с AI: распознавание речи, диаризация, саммари. Официальный пакет сервиса Vibe2Text"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Vibe2Text", email = "hello@vibe2text.ru" }]
keywords = [
    "транскрибация",
    "транскрибация-аудио",
    "транскрибация-видео",
    "расшифровка-аудио",
    "аудио-в-текст",
    "перевод-аудио-в-текст",
    "распознавание-речи",
    "диаризация",
    "транскрипция",
    "speech-to-text",
    "asr",
    "transcription",
    "diarization",
    "russian-asr",
    "audio-to-text",
    "vibe2text",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: Russian",
]
dependencies = []

[project.urls]
Homepage = "https://vibe2text.ru"
Documentation = "https://vibe2text.ru/help"
Repository = "https://github.com/vibe2text/vibe2text-mcp"
