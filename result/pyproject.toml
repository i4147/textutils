[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-textutils"
version = "0.1.0"
description = "A small collection of text utilities for Linux"
requires-python = ">=3.12"
dependencies = ["loguru>=0.7,<1", "typer>=0.12,<1"]

[project.scripts]
textutils = "textutils.cli:app"

[tool.setuptools.packages.find]
include = ["textutils*"]
